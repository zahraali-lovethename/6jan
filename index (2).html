<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Zahra 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink: #f472b6;
    --pink-light: #fce7f3;
    --pink-pale: #fdf2f8;
    --rose: #fb7185;
    --dark: #1a0a12;
    --mid: #6b3a52;
    --muted: #9d6080;
    --white: #ffffff;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--pink-pale);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, #fce7f350 0%, transparent 40%),
      radial-gradient(circle at 85% 70%, #fbcfe850 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, #fda4af30 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }
  .hearts-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .heart-float {
    position: absolute;
    opacity: 0.12;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-10deg); opacity: 0; }
    10%  { opacity: 0.15; }
    90%  { opacity: 0.1; }
    100% { transform: translateY(-100vh) rotate(10deg); opacity: 0; }
  }

  /* PAGE SYSTEM */
  .page { display: none; }
  .page.active { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }

  /* PAGE 1 — RECIPIENT */
  .recipient-page {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 500px;
    width: 100%;
    animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .envelope-anim {
    font-size: 5.5rem;
    display: block;
    margin: 0 auto 1.8rem;
    animation: envFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 8px 24px rgba(244,114,182,0.3));
  }
  @keyframes envFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%       { transform: translateY(-14px) rotate(2deg); }
  }
  .recipient-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
    font-style: italic;
    animation: cardIn 0.8s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .big-question {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 700;
    color: var(--dark);
    line-height: 1.15;
    margin-bottom: 0.7rem;
    animation: cardIn 0.8s 0.15s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .from-line {
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 2.8rem;
    animation: cardIn 0.8s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .from-line span { font-weight: 500; color: var(--pink); }

  .btns-wrap {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: cardIn 0.8s 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .btn-yes {
    padding: 1.1rem 3.2rem;
    background: linear-gradient(135deg, #f472b6, #fb7185);
    border: none;
    border-radius: 50px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(244,114,182,0.45);
    transition: all 0.2s;
  }
  .btn-yes:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 36px rgba(244,114,182,0.55); }
  .btn-no {
    padding: 1rem 2.4rem;
    background: white;
    border: 1.5px solid #fce7f3;
    border-radius: 50px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
  }

  /* PAGE 2 — YES */
  .yes-page {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 520px;
    width: 100%;
  }
  .confetti-emojis {
    font-size: 4rem;
    display: block;
    margin-bottom: 1rem;
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes popIn {
    from { transform: scale(0) rotate(-10deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .yes-title {
    font-family: 'Playfair Display', serif;
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--pink);
    margin-bottom: 0.4rem;
    animation: popIn 0.7s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .yes-sub {
    font-size: 1.05rem;
    color: var(--mid);
    margin-bottom: 2rem;
    animation: popIn 0.7s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .msg-box {
    background: white;
    border-radius: 28px;
    padding: 2rem 2.2rem;
    box-shadow: 0 12px 48px -8px rgba(244,114,182,0.2);
    font-size: 1.05rem;
    color: var(--mid);
    line-height: 1.75;
    animation: popIn 0.7s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    white-space: pre-line;
  }
  .msg-box .sig {
    margin-top: 1.2rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--pink);
    font-size: 1.15rem;
  }

  .confetti-particle {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 520px) {
    .big-question { font-size: 2rem; }
    .yes-title { font-size: 2.4rem; }
    .envelope-anim { font-size: 4rem; }
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<!-- ===== PAGE 1: ZAHRA KO DIKHEGA ===== -->
<div class="page active" id="page1">
  <div class="recipient-page">
    <span class="envelope-anim">💌</span>
    <p class="recipient-name">Hey Zahra,</p>
    <h1 class="big-question">Will you be mine forever?</h1>
    <p class="from-line">from <span>Ali</span> 🌸</p>
    <div class="btns-wrap">
      <button class="btn-yes" onclick="sayYes()">Yes! 💗</button>
      <button class="btn-no" id="noBtn" onclick="moveNoBtn()">No 😔</button>
    </div>
  </div>
</div>

<!-- ===== PAGE 2: YES PAGE ===== -->
<div class="page" id="page2">
  <div class="yes-page">
    <span class="confetti-emojis">🥳💗✨</span>
    <h2 class="yes-title">She said YES! 🎉</h2>
    <p class="yes-sub">Zahra said yes! You're the luckiest person alive 💗</p>
    <div class="msg-box">
      <!-- APNA MESSAGE YAHAN LIKHO -->
      Zahra, tum meri zindagi ki sabse khoobsurat cheez ho.
Tumhare bina sab adhoora lagta hai.
Main chahta hun ke tum hamesha mere saath raho. 🌸
      <div class="sig">— Ali 💌</div>
    </div>
  </div>
</div>

<script>
  // floating hearts
  const hb = document.getElementById('heartsBg');
  const symbols = ['♥','♡','❤','✿','❀','✦'];
  for (let i = 0; i < 22; i++) {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.bottom = '-2rem';
    h.style.animationDuration = (9 + Math.random() * 14) + 's';
    h.style.animationDelay = (Math.random() * 14) + 's';
    h.style.fontSize = (0.8 + Math.random() * 1.4) + 'rem';
    h.style.color = ['#f472b6','#fb7185','#fda4af','#f9a8d4','#e879f9'][Math.floor(Math.random()*5)];
    hb.appendChild(h);
  }

  // no button dodge
  let noMoves = 0;
  function moveNoBtn() {
    noMoves++;
    const btn = document.getElementById('noBtn');
    const maxX = window.innerWidth - 130;
    const maxY = window.innerHeight - 80;
    btn.style.position = 'fixed';
    btn.style.left = Math.random() * maxX + 'px';
    btn.style.top  = Math.random() * maxY + 'px';
    btn.style.zIndex = 99;
    if (noMoves >= 3) btn.style.opacity = '0.3';
    if (noMoves >= 5) btn.style.display = 'none';
  }

  function sayYes() {
    document.getElementById('page1').classList.remove('active');
    document.getElementById('page2').classList.add('active');
    window.scrollTo(0, 0);
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ['#f472b6','#fb7185','#fda4af','#f9a8d4','#c084fc','#a78bfa','#60a5fa','#34d399','#fbbf24'];
    for (let i = 0; i < 100; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti-particle';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-10px';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }, i * 25);
    }
  }
</script>
</body>
</html>
